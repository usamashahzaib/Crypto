services:
  - type: web
    name: cryptomind-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2
    autoDeployTrigger: commit
    envVars:
      - key: COINGECKO_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ETHERSCAN_KEY
        sync: false
